# Model & Effort Tier Strategy
# How to match model tier and reasoning effort to the work being dispatched —
# concentrating premium reasoning where judgment changes the outcome, and
# delegating evidence-checkable work to cheaper tiers.
# Sources:
#   - r/ClaudeAI community threads on tiered orchestration (2026-07, screenshots)
#   - Community "fable-chief-agent" skill (tiered delegation doctrine)
#   - DataCamp "Spec-Driven Development with Claude Code" tutorial
# Last updated: 2026-07-08

id: model-tier-strategy
name: "Model & Effort Tier Strategy"
description: "Rules for matching model tier and reasoning effort to dispatched work — judgment concentrates at the top tier, evidence-checkable work delegates down, risk escalates review tier"
pattern: rules
category: architecture
spec_relevant: false
project_applicability:
  relevant_when: "Always relevant — governs how the z-sdlc agent system spends model capability and token budget"
  action_if_irrelevant: keep
last_updated: 2026-07-08

# ─────────────────────────────────────────────
# Relationship to the Manager Rule
# ─────────────────────────────────────────────
# This file governs WHICH TIER does delegated work. Whether work is
# delegated at all is governed by [sdlc-root]/process/manager-rule.md,
# whose Delegation Economics Exception was adopted (by CD decision) from
# the same community sources: the manager may apply a change directly
# when delegation would cost more than the change itself — monetarily or
# in main-context growth — and the change is small, mechanical, and needs
# no new context. Two things economics never buys: skipping review (every
# manager-applied change is domain-agent-reviewed before commit) and
# absorbing design judgment (complexity always delegates).

rules:

  - rule_id: MTS1
    name: "Concentrate judgment at the top tier; delegate evidence-checkable work down"
    description: |
      The orchestrator's model tier is the most expensive reasoning in the
      system. Spend it only on work where being the strongest model changes
      the outcome:

      - understanding real user intent and deciding scope
      - choosing the architecture or approach
      - decomposing ambiguous work into clear parts
      - making tradeoffs between speed, quality, risk, and scope
      - resolving disagreement between agents' findings
      - deciding when work is good enough (final acceptance)

      Everything whose result can be verified from evidence delegates to a
      cheaper tier: finding files, reading large files, summarizing code
      paths, inspecting logs, running tests, scoped implementation,
      checklist verification, comparing results against the plan.

      The routing test: if the task is mostly searching, reading, editing,
      testing, or verifying, it belongs to a worker tier. If it involves
      intent, design, tradeoffs, risk arbitration, or final approval, it
      belongs at the orchestrator tier.
    rationale: |
      Top-tier judgment is the scarce resource; labor is not. A top-tier
      model spending its context on file reads and mechanical edits
      produces the same output a mid-tier model would, at several times
      the cost — and pollutes the orchestrator context that the judgment
      work depends on (see token-economics session hygiene). Delegation
      down-tier is nearly free when the result is evidence-checkable,
      because the orchestrator verifies the evidence rather than trusting
      the worker's reasoning.
    checklist:
      - "Before dispatching, can you state whether this task is judgment work or evidence work?"
      - "Is the orchestrator doing any searching/reading/editing that a worker tier could return as a summary?"
      - "Does delegated work come back with evidence (files changed, tests run, citations) the orchestrator can check?"
    anti_patterns:
      - "Top-tier orchestrator reading dozens of files itself instead of dispatching exploration to a cheap agent"
      - "Delegating the approach decision or finding arbitration to a worker agent — judgment stays at the top"
      - "Using tier economics to skip review of manager-applied changes — the Manager Rule's economics exception changes who types, never who reviews"
    source: "community fable-chief-agent skill; r/ClaudeAI tiered-orchestration threads (2026-07)"

  - rule_id: MTS2
    name: "The tier ladder — default model-to-work mapping"
    description: |
      Default mapping from model tier to work type, applied via agent
      frontmatter `model:` at agent-creation time and confirmed at
      dispatch time:

      | Tier | Work it owns |
      |------|-------------|
      | Top-tier session model (orchestrator) | Intent, scope, decomposition, tradeoffs, arbitration between agents, final review and acceptance |
      | opus | Hardest delegated reasoning: complex implementation, deep debugging, cross-module reasoning, architecture review, security-sensitive reasoning, concurrency/caching/data-consistency concerns, reviewing cheaper agents' work for hidden flaws |
      | sonnet | Normal engineering execution (the default worker): scoped implementation, adding/updating tests, medium-complexity debugging, local refactors, following existing patterns, connecting already-designed pieces |
      | haiku | Cheap evidence work: repo discovery, file and log summaries, simple checks, checklist verification, confirming a change matches the plan |

      Workers do not make product calls or change architecture — those
      route up. Haiku-tier agents report facts, not direction. Opus-tier
      agents reason deeply but the orchestrator keeps final authority.
    rationale: |
      Community practice converged on this split independently across
      multiple orchestration setups (haiku searching, sonnet executing,
      opus verifying, top tier coordinating) and reported both lower token
      usage and equal-or-better output versus running everything on one
      premium model. It matches the existing z-sdlc frontmatter guidance
      (sonnet default, opus for design decisions, haiku for retrieval) and
      extends it with the delegated-review role for opus.
    checklist:
      - "Does each agent's frontmatter model match the tier ladder for its primary work type?"
      - "Are recon/verification dispatches going to haiku-tier agents rather than implementation-tier ones?"
      - "Is opus reserved for genuinely hard delegated reasoning, not used as a default 'to be safe'?"
    anti_patterns:
      - "Running everything on opus 'to be safe' — model tiers are pre-assigned in agent frontmatter; trust the assignment"
      - "A haiku-tier recon agent deciding direction instead of reporting facts"
      - "Sonnet-tier worker making architecture calls that belong to the orchestrator or an opus-tier architect"
    source: "r/ClaudeAI tiered-orchestration threads (2026-07); community fable-chief-agent skill"

  - rule_id: MTS3
    name: "Effort is a second, independent lever — set it per agent role"
    description: |
      Reasoning effort (low → max) is orthogonal to model choice and can be
      set per subagent in agent frontmatter (`effort:`), overriding the
      session effort for that role — where the Claude Code version in use
      supports it. Combine the levers:

      - Recon and mechanical roles (discovery, summaries, checklist
        verification, routine edits) run at LOW effort — community-reported
        as "nearly free quality-wise" on current models.
      - Default workers (scoped implementation) run at the session default.
      - Judgment-heavy delegated roles (architecture review, security
        review, plan review on high-risk work) run at HIGH+ effort.

      When creating an agent, set `effort:` only when the role clearly
      deviates from the session default in one direction; omit it otherwise.
    rationale: |
      Model tier controls capability ceiling; effort controls how much of
      that ceiling is spent per response. When trading one lever against
      the other, compare cost per completed task, not per token. Treating
      effort as part of the role definition (frontmatter) rather than a
      per-dispatch decision keeps the lever deterministic and auditable.
    checklist:
      - "Do recon/mechanical agents declare low effort in frontmatter (when the harness supports it)?"
      - "Do review agents for high-risk domains declare high+ effort?"
      - "Was harness support for per-agent effort verified for the project's Claude Code version before relying on it?"
    anti_patterns:
      - "Setting effort per-dispatch in prompts when a stable per-role frontmatter value would do"
      - "Running discovery agents at max effort — pure spend with no quality return"
      - "Assuming effort frontmatter works without verifying the installed Claude Code version supports it"
    source: "r/ClaudeAI per-subagent effort thread (2026-07)"

  - rule_id: MTS4
    name: "Risk-escalated review — reviewer tier at or above implementer tier"
    description: |
      For high-risk domains, the review pass must run at a model tier equal
      to or above the tier that implemented the work. High-risk domains
      (aligned with the infrastructure_domains triggers in
      [sdlc-root]/process/agent-selection.yaml):

      - auth, permissions, access control
      - billing, payments
      - migrations, data loss potential
      - shared state, caching, concurrency
      - public APIs and user-visible workflows
      - security-sensitive input handling

      Pattern: the orchestrator makes the decision, a sonnet-tier worker
      implements, an opus-tier reviewer checks the hard technical parts for
      hidden flaws, and cheap agents verify concrete evidence (tests pass,
      checklist items hold). For low-risk work, same-tier review is fine.
    rationale: |
      A reviewer weaker than the implementer rubber-stamps subtle flaws —
      it lacks the capability to catch what the implementer missed.
      Reviewing cheaper agents' work for hidden flaws is one of the
      highest-value uses of the opus tier: review is read-dominant, so it
      costs far less than opus-tier implementation while recovering most
      of the quality delta.
    checklist:
      - "For each high-risk phase, is the assigned reviewer's model tier ≥ the implementer's?"
      - "Did the infrastructure_domains trigger scan inform which phases count as high-risk?"
      - "Is evidence verification (tests, checklists) still delegated to cheap agents even when opus reviews?"
    anti_patterns:
      - "Haiku-tier agent as the only reviewer of concurrency or auth changes"
      - "Skipping the escalated review because the implementation 'looked straightforward' — risk is domain-driven, not diff-size-driven"
      - "Escalating implementation to opus when escalating only the review would recover the quality at a fraction of the cost"
    source: "community fable-chief-agent skill (risk section); r/ClaudeAI opus-verification thread (2026-07)"

  - rule_id: MTS5
    name: "Stack-difficulty adjustment — tier defaults assume mainstream stacks"
    description: |
      The tier ladder's defaults assume stacks the mid-tier models handle
      well (mainstream web/TypeScript/Python). Model competence is uneven
      across stacks: community reports describe mid-tier workers
      "drowning in tool calls" on Rust codebases while performing well on
      frontend work. When a worker-tier agent shows thrash signals on a
      given stack — tool-call loops, repeated failed edits, the same
      category of compile error across retries — escalate that role's
      model tier for this project and record the observation in the
      architecture discipline parking lot.
    rationale: |
      Per-stack competence shifts with every model release, so it cannot
      be hardcoded into the ladder. What generalizes is the adjustment
      procedure: watch for thrash, escalate the role, record the evidence
      so the next tier decision in this project starts from observation
      rather than default.
    checklist:
      - "When a worker thrashes, was stack difficulty considered before re-prompting a third time?"
      - "Was the tier escalation recorded (parking lot or project knowledge) with the observed signals?"
      - "Are recorded stack observations rechecked when the project's model versions change?"
    anti_patterns:
      - "Re-dispatching a thrashing sonnet-tier agent repeatedly instead of escalating the tier — trajectory poisoning plus wasted spend"
      - "Globally escalating all agents because one stack was hard for one role"
      - "Treating a stack observation from one model version as permanent truth"
    source: "r/ClaudeAI thread — Sonnet on Rust codebases (2026-07)"

  - rule_id: MTS6
    name: "Plan wide on premium, execute narrow on cheap — session-level tiering"
    description: |
      The SDLC's phase boundaries are also model-tier boundaries. Planning
      sessions (sdlc-plan, sdlc-lite-plan, sdlc-idea) concentrate exactly
      the judgment work MTS1 assigns to the top tier — discovery
      interviewing, approach decisions, finding arbitration, spec/plan
      acceptance — so run the planning session's orchestrator on a top-tier
      model: Fable OR Opus, at CD's discretion (both are premium — choose by
      task, quota, and preference). The framework does
      not prescribe one; the load-bearing split is planning-premium vs
      execution-Sonnet, not which premium. The Manager Rule guarantees the
      premium model never spends tokens on implementation.

      Execution sessions (sdlc-execute, sdlc-lite-execute) act on judgment
      already committed to the plan artifact; their orchestrator can run
      on a mid-tier model, with worker agents at their frontmatter tiers
      and risk-escalated reviewers per MTS4. The plan file is the handoff
      contract between the tiers — which is why plans must carry outcomes,
      constraints, and acceptance criteria explicit enough for a cheaper
      executor to act on without re-deriving intent.
    rationale: |
      This extends token-economics' "plan wide, execute narrow" from
      context budgeting to model tiering. Spec-driven development works
      because each artifact gate (spec review, plan review, code review)
      catches a different class of mistake before it gets expensive;
      putting the strongest model at the artifact-producing gates and
      cheaper models behind them buys maximum error-prevention per token.
      Community setups running this split report lower token usage than
      single-premium-model sessions with equal or better output.
    checklist:
      - "Is the planning session running on a top-tier model — Fable or Opus, CD's choice (not prescribed to one)?"
      - "Does the plan carry outcomes/constraints/acceptance criteria concrete enough for a lower-tier execution session to act on?"
      - "At execution time, are per-phase reviewer tiers escalated per MTS4 rather than re-escalating the whole session?"
    anti_patterns:
      - "Running long execution sessions on the top-tier model when the judgment was already committed to the plan"
      - "Planning on a cheap model to save tokens — planning errors are the most expensive class to catch later"
      - "Writing vague plans that force the execution session to re-derive intent, silently pulling judgment work down-tier"
    source: "DataCamp spec-driven development tutorial; r/ClaudeAI SDD-coordinator thread (2026-07); [sdlc-root]/knowledge/architecture/token-economics.yaml"

  - rule_id: MTS7
    name: "Realize the reviewer/implementer tier gap through the write/review agent split, not stage-generic roles or dispatch overrides"
    description: |
      A domain agent that both writes and reviews its domain cannot carry
      two model tiers in one frontmatter `model:` field. The resolution is
      NOT to genericize agents by artifact stage (a "spec-reviewer",
      "plan-reviewer", "code-reviewer-of-everything") and it is NOT to rely
      on per-dispatch model override (the orchestrator CAN pass a per-
      invocation model — resolution order: CLAUDE_CODE_SUBAGENT_MODEL env
      var → per-invocation param → frontmatter → inherit — but this is only
      reliably controllable in Workflow scripts today, not in interactive
      Task-tool dispatch). Instead, realize the tier gap structurally:

      1. Keep DOMAIN agents. They own depth and are wired to domain
         knowledge via agent-context-map.yaml. Write vs review is a MODE the
         same agent operates in, not a separate role, and the review STAGE
         (spec / plan / code) is already selected by which skill runs and
         which lenses apply (review-lenses.md) — it does not need its own
         agent.
      2. Keep the cross-cutting REVIEW-ONLY layer — code-reviewer,
         software-architect, security-auditor. These are the escalated-tier
         reviewers. Set them to `opus` in frontmatter. Domain writers stay
         `sonnet`. This satisfies MTS4 (reviewer tier ≥ implementer tier)
         deterministically, with no dependence on dispatch-time override.
      3. Set `effort: low` on recon/mechanical agents' frontmatter — the
         one tier lever that IS fully stable at dispatch-independent
         frontmatter level today (overrides session effort).

      Genericizing by stage would (a) break knowledge routing — a stageless
      reviewer loads everything or nothing, (b) duplicate the skill's own
      stage orchestration, (c) shrink the ensemble diversity that
      debate-protocol.md identifies as the primary value driver, and (d)
      recreate the generalist-masking anti-pattern from agent-selection.yaml.
    rationale: |
      The tier gap the community achieves with per-dispatch model selection
      (sonnet writes, opus reviews) is achievable in interactive Claude Code
      without that mechanism, because z-sdlc already separates the reviewer
      agents from the writer agents. Assigning the reviewers a higher
      frontmatter tier is equivalent in effect and deterministic — it does
      not depend on whether interactive Task dispatch exposes a per-
      invocation model param (currently uncertain; solid only in Workflows).
      Domain depth and cross-vendor-style independence are preserved because
      the reviewers are still domain-aware, not stage-generic.
    checklist:
      - "Are code-reviewer, software-architect, and security-auditor set to opus in frontmatter (or the project's top available tier)?"
      - "Are domain writer agents at sonnet, with recon/mechanical agents carrying effort: low?"
      - "Has the project resisted adding stage-generic reviewer roles that would strip domain knowledge routing?"
      - "If per-dispatch write-vs-review tier separation on ONE agent is truly needed, is that work in a Workflow (where agent() sets model+effort per call) rather than relying on interactive Task override?"
    anti_patterns:
      - "Adding spec-reviewer / plan-reviewer / code-reviewer generic roles that have no domain and no knowledge-map wiring"
      - "Leaving reviewers at the same tier as writers and hoping interactive dispatch will override the model (unreliable today)"
      - "Collapsing domain agents into stage roles to 'simplify' — it discards the ensemble diversity that makes review valuable"
    source: "CD decision (2026-07); Claude Code sub-agents model-resolution + effort frontmatter (code.claude.com/docs/en/sub-agents); r/ClaudeAI tiered-orchestration threads (2026-07)"

# ─────────────────────────────────────────────
# Decision Record: structural tiering over per-call override (2026-07)
# ─────────────────────────────────────────────
# Why MTS7 uses the write/review agent split instead of per-dispatch
# model/effort override or a Workflow-based orchestration rewrite. Recorded
# so a future migration does not re-litigate it.

tier_override_decision:
  question: >
    Should the framework escalate a domain agent's OWN review pass to a higher
    tier (e.g., sonnet to write, opus to review the same agent) via per-call
    model/effort override — worth adopting Workflow scripts to get it — or is
    the structural approach (dedicated review-only agents at opus) sufficient?

  decision: >
    Keep the structural approach (MTS7). Do NOT rewrite orchestration as
    Workflow scripts to obtain per-call tiering, and do NOT rely on interactive
    per-dispatch override. Revisit only if the triggers below fire.

  rationale:
    - "Coverage: the opus review-only agents (code-reviewer, software-architect, security-auditor) already carry the highest-value lenses — correctness, security, architecture, DRY, overengineering. Escalating each domain agent's own review to opus adds depth only on domain-specific lenses that are already backstopped by those cross-cutting reviewers and are usually sonnet-adequate (the domain agent already has its domain knowledge loaded)."
    - "Cost: per-call tiering requires either a Workflow rewrite (agent() with per-call model/effort) or interactive per-dispatch override. The rewrite means maintaining a parallel JS orchestration path alongside the markdown skills (DRY/drift risk) and losing the conversational plan/spec gates. Large cost, modest quality increment."
    - "Scope: Workflows fit only the MECHANICAL implementation review-fix loop. Spec and plan review are human-gated (CD approval, DECIDE escalations via AskUserQuestion) and cannot run headless — so a Workflow could never replace sdlc-plan, only the code review loop inside execution."
    - "Roadmap: interactive per-dispatch model/effort override is a tracked Claude Code feature request (GitHub issues #62211, #64033). If it ships, same-agent tiering becomes available with zero Workflow rewrite — so investing in a Workflow orchestration layer now risks near-term obsolescence. Not yet documented in sub-agents.md as of 2026-07; do not design around it until it is."

  revisit_if:
    - "Interactive per-dispatch model/effort override becomes documented/stable in sub-agents.md — then MTS7 can optionally collapse the separate reviewer agents back into domain agents and escalate at review-dispatch. Update MTS7 and this record when it lands."
    - "Observed evidence that domain-specific review at sonnet is actually missing defects the opus cross-cutting reviewers do not catch. Only then consider a Workflow-backed variant of the implementation review-fix loop (NOT a full SDLC rewrite), as an optional path."

# ─────────────────────────────────────────────
# Assignment Rules: the followable procedure for setting model + effort
# ─────────────────────────────────────────────
# Consolidates MTS1–MTS7 into a decision procedure an author (or
# sdlc-develop-agent) applies at agent-creation time. Keyed by ROLE
# ARCHETYPE, not agent name — projects rename roles (debug-specialist vs
# debugger, frontend-developer vs frontend-engineer, three names for
# security review), so match on what the agent DOES, not what it is called.

assignment_rules:
  axes:
    model: "capability ceiling — what the agent CAN do. Follows work TYPE (judgment vs execution vs retrieval)."
    effort: "spend per response — how hard it thinks within the ceiling. Follows work INTENSITY."
    note: "Orthogonal. A sonnet/low and a sonnet/high agent are different tools; choose each independently."

  model_rules:
    - "M1 — Default is sonnet. Every domain writer/implementer archetype (frontend, backend, data, realtime, etc.). Normal engineering execution."
    - "M2 — opus when the core job is judgment that is NOT checkable from evidence: (a) cross-cutting review-only archetypes (code review, architecture review, security review); (b) hard delegated reasoning — deep debugging, architecture/design decisions, security-sensitive reasoning, concurrency/caching/data-consistency analysis."
    - "M3 — haiku only for pure retrieval/discovery archetypes whose output is facts, not direction (search, data-research). Haiku reports; it does not decide."
    - "M4 — Guardrail: never opus 'to be safe'. If the output is verifiable from evidence (tests pass, files found, checklist holds), it does not need opus. Over-escalation is pure cost."

  effort_rules:
    - "E1 — Default is to OMIT effort (inherit session). Set it only when the role STABLY deviates in one direction; effort is a per-role declaration, not a per-task tweak."
    - "E2 — effort: low on recon/mechanical archetypes regardless of model: discovery, file/log summaries, checklist verification, routine mechanical edits, retrieval. An agent at low effort that edits code also needs an instruction to run a real check (the project's tests, type-checker or build) before it reports the change done: at low effort, current Sonnet models more often report a change done without one."
    - "E3 — effort: high on judgment-heavy review of high-risk domains: escalated reviewers over auth, payments, migrations, concurrency, public APIs; deep-debugging agents. Raise a role to xhigh or max only where a measured quality gain justifies the longer turns and extra tokens."
    - "E4 — Everything else: leave effort unset."

  guardrails:
    - "G1 — Reviewer tier ≥ implementer tier (MTS4), realized STRUCTURALLY (opus review-only agents, MTS7), because interactive dispatch cannot override per call. Do not design around dispatch override."
    - "G2 — High-risk domains (auth, payments, permissions, migrations, concurrency, public APIs) constrain assignment: the reviewing agent must be opus + high effort; the manager's own economics-exception fixes are limited to trivial-class there."
    - "G3 — Stack-difficulty override (MTS5): if a sonnet writer thrashes on a hard stack (e.g., Rust), escalate THAT role's model for the project and record it — do not just re-dispatch."
    - "G4 — It all lives in frontmatter. effort: there is stable and overrides session effort; per-call override is Workflow-only. Set once per agent."
    - "G5 — AI/ML correctness is NOT evidence-checkable. For ML/LLM/RAG/agentic archetypes (ml-engineer, ml-architect, prompt/llm-engineer, agent-system builders), a passing run is not verification — data leakage, invalid metrics, contaminated benchmarks, and prompt-injection surfaces pass silently. Implementation may be sonnet, but the CORRECTNESS review escalates to opus + high effort regardless of implementation tier (amplifies G1). Pair LLM-integration review with a security reviewer for the injection/tool-schema surface. Provisioning of the opus-tier AI functions is governed by ai_ml_provisioning below."

  ai_ml_provisioning:
    principle: >
      G5 requires two FUNCTIONS covered at opus for AI-adjacent work — not
      necessarily two dedicated agents. (1) AI system DESIGN/judgment (eval
      strategy, model choice, data-pipeline shape, confidence gates, RAG
      architecture) and (2) AI-aware CORRECTNESS REVIEW (leakage, metric
      validity, benchmark contamination, injection surface). Implementation
      itself stays sonnet. This is the ordinary implementer/reviewer split
      (MTS7) applied to the one domain where reviewer escalation is
      mandatory, not optional. In the efficient form a single opus
      ai-architect fills BOTH functions (designs, and provides the escalated
      review), so the "duo" is implementer + opus-AI-lead, not three agents.
    decision:
      - "AI is the CORE value prop (ML pipelines, RAG, agentic features, a recommendation/intelligence engine): dedicate the duo — an ai/ml-architect (opus: design authority AND escalated AI reviewer) + an ai/ml-engineer (sonnet: implements). The design surface is large and the silent-failure hazard high, so specialization earns its keep and avoids generalist-masking. Example: one project grew this organically as an llm-engineer (sonnet) plus a domain intelligence engineer (opus)."
      - "AI is a FEATURE, not the core (one LLM-backed feature in an otherwise conventional app): do NOT spin up a dedicated architect. Use an llm/ml-engineer implementer (sonnet); cover the escalated review by dispatching the EXISTING software-architect + code-reviewer AT OPUS with the AI knowledge injected (knowledge/testing/ai-generated-code-verification.yaml, knowledge/architecture/ml-system-design.yaml, knowledge/architecture/prompt-engineering-patterns.yaml), plus security-engineer for the injection/tool-schema surface. The two functions are covered without a new agent."
      - "AI is INCIDENTAL (a single prompt somewhere): generic agents at normal tiers + a security reviewer for the injection surface. No AI specialist."
    rule: >
      Provision by FUNCTION coverage, not agent count. Make the dedicated
      ai-architect + ai-engineer pair only when AI is core to the product;
      otherwise inject the AI review lenses into the existing opus reviewers.
      Right-size per AOP5 — do not add an AI specialist "to be safe" (M4).

  reviewer_invariant:
    rule: >
      Reviewer tier ≥ implementer tier is a per-project invariant on BOTH axes
      combined: a reviewer must out-rank the implementers it reviews by MODEL,
      or by EFFORT when model is already maxed. The cross-cutting review-only
      agents default to opus/high. An all-sonnet project with a sonnet
      code-reviewer violates the intent — bump the reviewer to opus (or at
      minimum higher effort than the writers).

  project_baseline:
    rule: >
      A project may raise the baseline implementer MODEL when its domain is
      systematically hard (game engine, realtime/performance-critical, kernel,
      novel-stack). This is MTS5 applied project-wide rather than per-role.
      When implementers are already at opus, reviewers can no longer out-model
      them, so the reviewer_invariant shifts to the EFFORT axis: implementers
      opus/default, reviewers opus/high. This is the clearest case for why
      effort is a first-class lever, not optional decoration.
    example: "A game/realtime project runs its game-engine, gameplay, realtime, and web-gameplay implementers at opus; its reviewers should differ by effort, not model."

  archetype_table:
    - { archetype: "domain writer / implementer", model: sonnet, effort: "unset", examples: "frontend-*, backend-*, data-engineer, realtime-*" }
    - { archetype: "cross-cutting review-only",   model: opus,   effort: high,    examples: "code-reviewer, software-architect, security review" }
    - { archetype: "hard-reasoning specialist",    model: opus,   effort: high,    examples: "debug-specialist/debugger, architecture/design deciders" }
    - { archetype: "recon / retrieval",            model: haiku,  effort: low,     examples: "search-*, data-researcher" }
    - { archetype: "mechanical / checklist",       model: "sonnet|haiku", effort: low, examples: "catalog-updater, formatter-style" }
    - { archetype: "AI/ML implementer",            model: sonnet, effort: "unset", examples: "ml-engineer, llm-engineer, ai-engineer — but see G5: review escalates to opus/high" }
    - { archetype: "AI/ML architect + reviewer",   model: opus,   effort: high,    examples: "ai/ml-architect, taste-intelligence-engineer — design authority AND escalated AI-correctness review; dedicate only when AI is core (see ai_ml_provisioning)" }

  # ── Field evaluation of installed sub-agents (informs the rules above) ──
  survey_2026_07:
    scope: "five projects (28, 16, 22, 14 and 33 agents) — 113 agents installed before the tier strategy existed"
    findings:
      - "effort unset on 113/113 agents — the lever is defined but applied nowhere. Existing installs need an effort BACKFILL on next migration (recon→low, escalated reviewers/high-risk review→high)."
      - "code-reviewer is sonnet in 3 of the 5 projects — violates the reviewer_invariant / MTS7 opus default; opus in the other two."
      - "security-review agents inconsistent (infosec-engineer/security-auditor/security-infrastructure-engineer: opus in some, sonnet in others) — G2 wants opus/high for high-risk-domain review."
      - "deep-debugging split: opus in two projects, sonnet in two others — M2 wants opus for hard-reasoning debug."
      - "AI/ML implementers (ai-engineer, llm-engineer, ml-engineer) are sonnet with non-escalated reviewers in two projects — confirmed the G5 gap in the wild."
      - "The game/realtime project runs implementers at opus wholesale — the project_baseline pattern; motivated making effort the reviewer differentiator when model is maxed."
      - "role names drift across projects — the rules must key on archetype, not name (already reflected in archetype_table)."
    consequence: >
      No new tier LADDER was needed — the survey validated MTS1–MTS7. It added
      three things: the reviewer_invariant (both-axes framing), the
      project_baseline pattern, and the finding that effort backfill is a
      migration action for pre-existing installs. A future sdlc-audit
      dimension could flag agents whose model/effort violate these rules.

