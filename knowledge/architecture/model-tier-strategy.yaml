# Maintenance
# ─────────────────────────────────────────────

maintenance:
  add_when: >
    A new tier-matching pattern proves repeatedly useful or a tier default
    proves repeatedly wrong (e.g., a model release shifts per-stack
    competence). Add as MTS-N with rationale and checklist.
  boundary_rule: >
    This file owns model/effort tier selection. Group sizing, dispatch
    prompt structure, and dependency-graph design live in
    [sdlc-root]/knowledge/architecture/agent-orchestration-patterns.yaml.
    Context budgeting and session hygiene live in
    [sdlc-root]/knowledge/architecture/token-economics.yaml. Whether to
    delegate at all is governed by [sdlc-root]/process/manager-rule.md.
