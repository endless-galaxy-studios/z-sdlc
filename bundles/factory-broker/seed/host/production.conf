# This project's production tier settings for setup-production.sh (z-sdlc factory-broker bundle). Setup reads this
# file as text and never runs it: each line is blank, a comment, or KEY=value for one of the settings below, each set
# at most once, with no $, backquote or command in it (quote a value with spaces: PROBE_PORTS="22 8080"). Keep it
# code-owned like the script. As root, setup uses the default branch's copy, fetched by root, and refuses a checkout
# whose production.conf isn't the default branch's, so commit what this host needs. A setting given on the command
# line instead (sudo AGENT_USER=... bash setup-production.sh) is refused, not used.
# `bash .github/factory/host/setup-production.sh --print-settings` (never with sudo; TIER_OWNER=<owner>/<repository>
# until the tier has a record) shows every name the settings give. The repository that owns the tier never goes here:
# setup records it on the tier's first run, from TIER_OWNER on the command line.

# The tier's instance: empty for the first production tier on this host, which gets the plain names (factory-prod,
# factory-op, /etc/factory-prod, ...). A later tier on the same host sets 1 to 12 lowercase letters or digits, say
# PROD_INSTANCE=acme, and gets its own (factory-prod-acme, factory-op-acme, /etc/factory-prod-acme, ...). Setup refuses
# an instance whose names another tier on the host already holds, and the words op, egress, clone, runner, firewall,
# drift and step, which the first tier's own names end in.
PROD_INSTANCE=

# Required: the login the agent sessions run as on this host. It may run the broker's check and health without a
# password; every other broker command asks for the password each time. There is no default.
#AGENT_USER=

# Required: the production runner's name, unique in the organization (say <host>-production, or
# <host>-production-<instance> for a later tier). Registration never replaces a runner that holds the name.
#PROD_RUNNER_NAME=

# The runner group the production runner registers to (default: factory.json's runners.groups.production, else
# factory-pool-<repository>-prod, the group bootstrap.py checks).
#RUNNER_GROUP=

# A LAN resolver the runner may use besides the local stub resolver 127.0.0.53: one IPv4 address (default: none).
#LAN_DNS=

# Ports of the other services on this host (another tier's database, say) that this tier's users must find closed on
# every address of this machine: setup probes each one, and one that root can't reach either proves nothing and is
# reported (default: none).
#PROBE_PORTS="8000 9000"

# Where the runner user's home goes (default /var/lib/factory).
#PROD_HOME_BASE=/var/lib/factory
