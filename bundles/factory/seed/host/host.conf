# This runner host's settings for setup.sh (z-sdlc factory bundle). Shell assignments, sourced by
# setup.sh as root, so keep this file code-owned like the script: setup runs the default branch's copy,
# fetched by root, and refuses a checkout whose host.conf isn't the default branch's, so commit what this
# host needs. Each has a default when unset; uncomment and set what this host needs.
# `bash .github/factory/host/setup.sh --print-settings` (never with sudo) shows the result. TIER and
# TIER_OWNER never go here: they're given on setup's command line, and setup refuses a host.conf that
# sets either.

# The GitHub organization the runners register to (default: the owner of the tier's repository).
#FACTORY_ORG=your-org
# A short name for this organization's runners when the host already runs another organization's
# (default: none, the plain names factory-runner and factory-planner). With one, say `acme`, they are
# factory-runner-acme and factory-planner-acme, with their own firewall tables and services. Write it
# plainly (RUNNER_INSTANCE=acme): setup's bootstrap reads it as text, before it runs anything.
#RUNNER_INSTANCE=
# Where the runner users' homes go (default /var/lib/factory); runners and images need tens of GB.
#RUNNER_HOME_BASE=/var/lib/factory
# Runner names: <prefix>-factory, <prefix>-planner (default: the short hostname).
#RUNNER_NAME_PREFIX=
# A LAN resolver jobs may use besides the local stub resolver 127.0.0.53 (default: none).
#LAN_DNS=
# Ports the isolation test must find closed on this host and the LAN (default: common service ports).
#PROBE_PORTS="22 80 443 3000 5432 6379 8000 8080"
# A database port the planning tier may reach (default: none; D3 rule 2): on this host's own addresses, or, when
# production runs on another machine, on the one IPv4 address PLANNING_DB_HOST names. Use an address that doesn't
# change (its Tailscale address, say): the firewall exception is that address.
#PLANNING_DB_PORT=
#PLANNING_DB_HOST=

# Runners and limits per tier (defaults: strict 3, 8G/10G, 400%; planning 2, 4G/5G, 200%; ci 2, 14G/16G, 800%).
# Each limit caps the tier's runners together, not each one. Each organization's runners on a shared host have
# their own; together they must leave enough for everything else there.
#STRICT_RUNNERS=3
#STRICT_MEMORY_HIGH=8G
#STRICT_MEMORY_MAX=10G
#STRICT_CPU_QUOTA=400%
#PLANNING_RUNNERS=2
#PLANNING_MEMORY_HIGH=4G
#PLANNING_MEMORY_MAX=5G
#PLANNING_CPU_QUOTA=200%
# The CI tier (TIER=ci): one disposable runner per job, for a project's own end-to-end suites, CPU-bound (a server,
# browsers, a database). The runner-registration App's client ID (create_app.py --runners) is required; its key is
# installed root-only at /etc/factory-runner/factory-ci/app.pem, never next to this file. CI_RUNNERS is how many
# jobs run at once, each in a container capped by CI_JOB_*, killed after CI_JOB_HOURS of job time and recycled after
# CI_IDLE_HOURS idle; no job starts, and a running one is killed, below CI_MIN_FREE_GB free under the runner's home
# (put RUNNER_HOME_BASE on a filesystem of its own). The slice caps the jobs together: CI_MEMORY_HIGH must cover
# CI_RUNNERS x CI_JOB_MEMORY + 2G, and CI_CPU_QUOTA is what leaves the host's own work its cores. Check the jobs'
# timeout-minutes against the first capped runs and adjust.
#CI_APP_CLIENT_ID=
#CI_RUNNERS=2
#CI_JOB_CPUS=4
#CI_JOB_MEMORY=6g
#CI_JOB_PIDS=8192
#CI_JOB_SHM=1g
#CI_JOB_HOURS=6
#CI_IDLE_HOURS=24
#CI_MIN_FREE_GB=20
#CI_MEMORY_HIGH=14G
#CI_MEMORY_MAX=16G
#CI_CPU_QUOTA=800%
