# Factory gate request (design rule D4). Builds the request for the production gate an execution PR is
# stopped at, from the approved plan on the default branch, the PR's head and the earlier gates' signed
# results, and dispatches factory-gate.yml with it. The run's title carries the request's digest; CD
# approves that run. factory-implement dispatches this when execution stops at a gate, factory-revise when
# a revision does (both with the commit they pushed), factory-gate-trigger.yml when CD adds
# factory:gate-retry, and factory-advance when CD merges a release gate's release PR. It never approves or
# runs anything itself. A release gate (D4 rule 13) first pins the stopped commit on a branch nothing can move
# and opens a release PR from it into the release branch; CD's merge is the deploy, and only then does this
# ask for the gate run, which checks production serves the release.
name: factory-gate-request
run-name: "factory-gate-request: PR #${{ inputs.pr }}"

on:
  workflow_dispatch:
    inputs:
      pr:
        description: The factory execution PR stopped at a gate
        type: number
        required: true
      requester:
        description: Who asked with factory:gate-retry (needs write access); empty when the factory asks
        type: string
        default: ""
      head:
        description: The commit the factory stopped at; no request if the PR has moved since. Empty for a retry
        type: string
        default: ""
      released:
        description: The release PR whose merge asked for this (factory-advance), for a release gate; empty otherwise
        type: string
        default: ""

permissions: {}

concurrency:
  group: factory-gate-request-${{ inputs.pr }}

env:
  PR: ${{ inputs.pr }}
  APP_ID: "%{app.user_id}"
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  request:
    runs-on: ubuntu-latest
    environment: %{environments.writer}
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Comments and labels on the PR, and a release gate's release PR, as the factory App.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write

      # A release gate's pinned branch needs a contents token. It's minted only for a release gate, and used only in
      # the step that pins: no step that parses the PR, its comments or the plan holds it.
      - name: Find a release gate's pinned branch
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: "%{release.branch?}"
          REQUESTER: ${{ inputs.requester }}
          STOPPED_HEAD: ${{ inputs.head }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Says nothing: the request step below makes the same checks and says why it stops.
          pin="" head=""
          if [ -n "$RELEASE_BRANCH" ]; then
            allowed=yes
            if [ -n "$REQUESTER" ]; then
              perm=$(gh api "repos/$GH_REPO/collaborators/$REQUESTER/permission" --jq .permission 2> /dev/null || echo none)
              case "$perm" in admin|maintain|write) ;; *) allowed="" ;; esac
            fi
            gh api "repos/$GH_REPO/pulls/$PR" > pin-pr.json
            head=$(jq -r .head.sha pin-pr.json)
            if [ -n "$STOPPED_HEAD" ] && [ "$head" != "$STOPPED_HEAD" ]; then allowed=""; fi
            if [ -n "$allowed" ]; then
              gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[]' > pin-comments.ndjson
              if plan=$(python3 -I .github/factory/gates.py plan-path --comments pin-comments.ndjson --app-id "$APP_ID" 2> /dev/null) &&
                 gh api "repos/$GH_REPO/contents/$plan?ref=$DEFAULT_BRANCH" > pin-plan.json 2> /dev/null &&
                 python3 -I .github/factory/gates.py release-gate --repo "$GH_REPO" --app-id "$APP_ID" \
                   --factory-dir .github/factory --pr-json pin-pr.json --comments pin-comments.ndjson \
                   --plan-meta pin-plan.json --out pin-gate.json > /dev/null 2>&1; then
                pin=$(jq -r .pin pin-gate.json)
              fi
            fi
          fi
          # Only a pinned branch's own name and a commit SHA reach the next steps.
          [[ $pin =~ ^factory/release/[0-9]+-G[1-9][0-9]?-[0-9a-f]{12}$ && $head =~ ^[0-9a-f]{40}$ ]] || pin=""
          { echo "pin=$pin"; echo "head=${pin:+$head}"; } >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: pin
        if: steps.release.outputs.pin != ''
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write

      # The pin: created once, at the exact commit the factory checked, and only where a ruleset keeps it there (D4
      # rule 13). Without one, the pinned branch could move after CD reviewed it, and CD would merge another commit.
      # It writes its outcome for the request step, which says it on the PR: this step holds no token that comments.
      - name: Pin the release gate's commit
        if: steps.release.outputs.pin != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PIN_TOKEN: ${{ steps.pin.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PIN: ${{ steps.release.outputs.pin }}
          PIN_HEAD: ${{ steps.release.outputs.head }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/pin-result.txt"
          if ! rules=$(gh api "repos/$GH_REPO/rules/branches/$PIN" --jq '[.[].type]' 2> /dev/null); then
            echo "GitHub didn't say which rules cover \`$PIN\`, so the factory can't tell it's kept from moving. Add \`factory:gate-retry\` to try again." > "$result"; exit 0
          fi
          missing=$(jq -rn --argjson have "$rules" '["update", "non_fast_forward", "deletion"] - $have | join(", ")')
          if [ -n "$missing" ]; then
            echo "no ruleset keeps \`$PIN\` from moving (rules missing: $missing). Add the pinned branches' ruleset (\`factory/release/**\`, process/factory.md Enablement step 9; \`bootstrap.py\` checks it), then add \`factory:gate-retry\`." > "$result"; exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/heads/$PIN" > /dev/null 2>&1; then
            echo ok > "$result"; exit 0  # the request step checks its commit
          fi
          if ! GH_TOKEN="$PIN_TOKEN" gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$PIN" -f sha="$PIN_HEAD" > /dev/null 2> pin.err; then
            echo "GitHub refused the pinned branch \`$PIN\` ($(head -c 300 pin.err | tr '\n' ' ')). Add \`factory:gate-retry\` once that's resolved." > "$result"; exit 0
          fi
          echo ok > "$result"

      - name: Build the request and dispatch the gate run
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: "%{release.branch?}"
          PINNED: ${{ steps.release.outputs.pin }}
          REQUESTER: ${{ inputs.requester }}
          STOPPED_HEAD: ${{ inputs.head }}
          RELEASED: ${{ inputs.released }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          say() { GH_TOKEN="$APP_TOKEN" gh api "repos/$GH_REPO/issues/$PR/comments" -f body="$1 <sub>factory gate request · [run]($RUN_URL)</sub>" > /dev/null; }
          GH_TOKEN="$APP_TOKEN" gh api -X DELETE "repos/$GH_REPO/issues/$PR/labels/factory:gate-retry" > /dev/null 2>&1 || true
          if [ -n "$REQUESTER" ]; then
            perm=$(gh api "repos/$GH_REPO/collaborators/$REQUESTER/permission" --jq .permission 2> /dev/null || echo none)
            case "$perm" in admin|maintain|write) ;; *) say "A gate retry needs someone with write access."; exit 0 ;; esac
          fi
          gh api "repos/$GH_REPO/pulls/$PR" > pr.json
          # The factory asks for a gate on the commit it checked and pushed: a push since then is other code.
          head=$(jq -r .head.sha pr.json)
          # A release gate's PR merged at an older commit than the PR's head (a stale one, reopened): production runs
          # that commit now. Said only once GitHub confirms the release PR is the App's, from this PR's pin at it.
          if [ -n "$STOPPED_HEAD" ] && [ "$head" != "$STOPPED_HEAD" ] && [[ $RELEASED =~ ^[0-9]+$ ]] && [ -n "$RELEASE_BRANCH" ] &&
             gh api "repos/$GH_REPO/pulls/$RELEASED" 2> /dev/null | jq -e --argjson app "$APP_ID" --arg repo "$GH_REPO" \
               --arg base "$RELEASE_BRANCH" --arg sha "$STOPPED_HEAD" --arg prefix "factory/release/$PR-G" \
               '.merged == true and .user.id == $app and .base.ref == $base and .head.sha == $sha and
                .head.repo.full_name == $repo and (.head.ref | startswith($prefix)) and
                (.head.ref | endswith("-" + $sha[:12]))' > /dev/null; then
            say "**Release PR #$RELEASED deployed \`${STOPPED_HEAD:0:12}\`, not this PR's head \`${head:0:12}\`.** Production runs that older commit now. Check production, then roll back through the host and revert it in the release branch, or add \`factory:gate-retry\` to release the new commits."; exit 1
          fi
          if [ -n "$STOPPED_HEAD" ] && [ "$head" != "$STOPPED_HEAD" ]; then
            say "No gate run started: the branch moved after the factory stopped before the gate (\`${STOPPED_HEAD:0:7}\` to \`${head:0:7}\`). Review the new commits, then add \`factory:gate-retry\` to ask for the gate on them."; exit 1
          fi
          gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[]' > comments.ndjson
          plan=$(python3 -I .github/factory/gates.py plan-path --comments comments.ndjson --app-id "$APP_ID")
          gh api "repos/$GH_REPO/contents/$plan?ref=$DEFAULT_BRANCH" > plan.json
          common=(--repo "$GH_REPO" --app-id "$APP_ID" --factory-dir .github/factory --pr-json pr.json
                  --comments comments.ndjson --plan-meta plan.json)
          release=()
          if ! python3 -I .github/factory/gates.py release-gate "${common[@]}" --out release-gate.json > why.txt; then
            say "No gate run started: $(sed 's/^::error:://' why.txt | head -c 400)"; exit 1
          fi
          read -r rgate pin < <(jq -r '[.gate, .pin] | @tsv' release-gate.json)
          if [ -n "$pin" ]; then
            # A release gate (D4 rule 13): CD's merge of its release PR is the deploy; the gate run follows it.
            if [ -z "$RELEASE_BRANCH" ]; then
              say "No gate run started: $rgate is a release gate, but factory.json names no release branch (\`release.branch\`)."; exit 1
            fi
            # The pin, from the step before, which created it once at the exact commit the factory checked, and only
            # under its ruleset. A branch of that name at any other commit was made by something else, and is never
            # used: CD deletes it with its ruleset off.
            if [ "$PINNED" != "$pin" ]; then
              say "No release PR opened: the pinning step saw a different gate. Add \`factory:gate-retry\` to try again."; exit 1
            fi
            why=$(cat "$RUNNER_TEMP/pin-result.txt" 2> /dev/null || echo "the pinning step didn't finish.")
            if [ "$why" != ok ]; then
              say "No release PR opened: $why"; exit 1
            fi
            if ! at=$(gh api "repos/$GH_REPO/git/ref/heads/$pin" --jq .object.sha 2> /dev/null); then
              say "No release PR opened: the pinned branch \`$pin\` isn't there. Add \`factory:gate-retry\` to try again."; exit 1
            fi
            if [ "$at" != "$head" ]; then
              say "No gate run started: \`$pin\` already exists, at \`${at:0:12}\`, not the gate's commit \`${head:0:12}\`. The factory never uses a pinned branch it didn't create at its commit: delete it (with its ruleset off), then add \`factory:gate-retry\`."; exit 1
            fi
            # Only the App's own release PRs from the pin, in this repository, at this commit: any other PR from a
            # branch of that name is someone else's, and merging it would deploy their code.
            ours="select(.user.id == $APP_ID and .head.repo.full_name == \"$GH_REPO\" and .head.sha == \"$head\")"
            gh api "repos/$GH_REPO/pulls?state=all&base=$RELEASE_BRANCH&head=${GH_REPO%%/*}:$pin&per_page=100" > release-prs.json
            merged=$(jq -r "[.[] | $ours | select(.merged_at != null) | .number][0] // empty" release-prs.json)
            if [ -z "$merged" ]; then
              open=$(jq -r "[.[] | $ours | select(.state == \"open\") | .number][0] // empty" release-prs.json)
              if [ -n "$open" ]; then
                say "**$rgate deploys when you merge** release PR #$open into \`$RELEASE_BRANCH\`; then approve the gate run that follows."; exit 0
              fi
              # GitHub allows one open PR per branch pair: someone else's would block the App's.
              theirs=$(jq -r "[.[] | select(.state == \"open\") | .number][0] // empty" release-prs.json)
              if [ -n "$theirs" ]; then
                say "No release PR opened: #$theirs, not the factory's, is open from \`$pin\` into \`$RELEASE_BRANCH\`, and GitHub allows one. Close it without merging, then add \`factory:gate-retry\`."; exit 1
              fi
              gh api "repos/$GH_REPO/compare/$RELEASE_BRANCH...$head" > compare-release.json
              gh api "repos/$GH_REPO/compare/$DEFAULT_BRANCH...$head" > compare-default.json
              if [ "$(jq -r .total_commits compare-release.json)" = 0 ]; then
                say "No release PR opened: \`$RELEASE_BRANCH\` already has \`${head:0:12}\`, so $rgate has nothing to release. Production may serve it already, through another release: decide by hand whether to close this PR or release it another way."; exit 1
              fi
              python3 -I .github/factory/gates.py release-pr "${common[@]}" --release-branch "$RELEASE_BRANCH" \
                --default-branch "$DEFAULT_BRANCH" --compare-release compare-release.json \
                --compare-default compare-default.json --run-url "$RUN_URL" --out release-pr.md
              if ! url=$(GH_TOKEN="$APP_TOKEN" gh pr create --base "$RELEASE_BRANCH" --head "$pin" \
                           --title "Release $rgate of #$PR" --body-file release-pr.md 2> create.err); then
                say "No release PR opened: GitHub refused it ($(head -c 300 create.err | tr '\n' ' ')). Add \`factory:gate-retry\` once that's resolved."; exit 1
              fi
              say "**$rgate deploys when you merge** $url into \`$RELEASE_BRANCH\`. Review it there: it lists every commit merging deploys. Then approve the gate run that follows."
              # This gate's release PRs and waiting gate runs at other commits are stale: they'd deploy or check
              # code the gate isn't at.
              prefix="${pin%-*}-"
              gh api "repos/$GH_REPO/pulls?state=open&base=$RELEASE_BRANCH&per_page=100" --paginate \
                --jq ".[] | select(.user.id == $APP_ID and .head.repo.full_name == \"$GH_REPO\" and (.head.ref | startswith(\"$prefix\")) and .head.ref != \"$pin\") | .number" |
                while read -r stale; do
                  GH_TOKEN="$APP_TOKEN" gh pr close "$stale" --comment "Replaced by $url: $rgate of #$PR is now at \`${head:0:12}\`. <sub>factory gate request · [run]($RUN_URL)</sub>" > /dev/null
                done
              gh api "repos/$GH_REPO/actions/workflows/factory-gate.yml/runs?status=waiting&per_page=100" \
                --jq ".workflow_runs[] | select(.display_title | startswith(\"factory-gate #$PR \")) | .id" |
                while read -r id; do
                  gh api -X POST "repos/$GH_REPO/actions/runs/$id/cancel" > /dev/null
                  echo "Cancelled stale gate run $id" >> "$GITHUB_STEP_SUMMARY"
                done
              echo "Opened $url for $rgate" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            gh api "repos/$GH_REPO/pulls/$merged" > release-pr.json
            release=(--release-branch "$RELEASE_BRANCH" --release-pr release-pr.json)
          fi
          if ! python3 -I .github/factory/gates.py request "${common[@]}" ${release[@]+"${release[@]}"} --out request.json > why.txt; then
            say "No gate run started: $(sed 's/^::error:://' why.txt | head -c 400)"; exit 1
          fi
          read -r gate attempt kind digest < <(jq -r '[.gate, .attempt, .kind, .digest] | @tsv' request.json)
          # One gate run per PR at a time. One already waiting for this exact request: nothing to do. A run
          # waiting on an older request is stale: cancel it, since approving it would only be refused.
          active=$(for s in waiting queued in_progress pending requested; do
                     gh api "repos/$GH_REPO/actions/workflows/factory-gate.yml/runs?status=$s&per_page=100" \
                       --jq ".workflow_runs[] | select(.display_title | startswith(\"factory-gate #$PR \")) | [.id, .status, .display_title] | @tsv"
                   done)
          while IFS=$'\t' read -r id status title; do
            [ -n "$id" ] || continue
            if [ "${title##* }" = "$digest" ]; then
              say "Gate $gate already has a run waiting for your approval: [run $id]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id)."; exit 0
            fi
            if [ "$status" = waiting ]; then
              gh api -X POST "repos/$GH_REPO/actions/runs/$id/cancel" > /dev/null
              echo "Cancelled stale gate run $id" >> "$GITHUB_STEP_SUMMARY"
            else
              say "A gate run is in progress ([run $id]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$id)); wait for its result."; exit 0
            fi
          done <<< "$active"
          gh workflow run factory-gate.yml --ref "$DEFAULT_BRANCH" -f pr="$PR" -f gate="$gate" -f attempt="$attempt" \
            -f kind="$kind" -f digest="$digest" -f request="$(base64 -w0 request.json)"
          echo "Requested $gate attempt $attempt ($kind) for PR #$PR: digest $digest" >> "$GITHUB_STEP_SUMMARY"
